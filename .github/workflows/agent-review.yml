name: Agent Factory Review
on: pull_request
permissions:
  contents: read
  pull-requests: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @labs/agent-factory test
      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' | jq -R -s 'split("\n") | map(select(length > 0))' > changed-paths.json
      - run: pnpm --filter @labs/agent-factory review "$GITHUB_WORKSPACE/changed-paths.json"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-review-report
          path: agent-factory/agent-review.json
          if-no-files-found: error
